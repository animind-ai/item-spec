name: ci
on:
  push:
    branches: [main]
  pull_request:

# item-spec 以可编辑路径依赖同级目录的 scene-spec，所以两个仓库并排检出
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: item-spec
    steps:
      - uses: actions/checkout@v4
        with:
          path: item-spec
      - uses: actions/checkout@v4
        with:
          repository: animind-ai/scene-spec
          path: scene-spec
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uvx ruff check .
      - run: uv run pytest -q
      - run: uv run item-spec check examples/*.items.yaml
      - run: uv run item-spec check examples/ep21.items.yaml --scene ../scene-spec/examples/ep21.scene.yaml
