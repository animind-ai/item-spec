[project]
name = "item-spec"
version = "0.1.0"
description = "数学练习题的结构化描述格式：JSON Schema 与检查器"
readme = "README.md"
license = "MIT"
authors = [{ name = "Boxi Yu" }]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "scene-spec",  # 复用受限 YAML 读取器和检查报告；--scene 交叉检查也用它
]

[project.scripts]
item-spec = "item_spec.cli:main"

[tool.uv.sources]
scene-spec = { path = "../scene-spec", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/item_spec"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "item_spec/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
